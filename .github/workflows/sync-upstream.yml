name: Sync Instructor Updates

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/abhilashdasari123/aws-de-course-keystone.git
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
